<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7fbfa">
  <title>{% block title %}會員帳號{% endblock %}｜CampusMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
  <div class="prototype-note"><span class="note-dot"></span> CampusMate・校園生活資訊小幫手</div>
  <header class="site-header"><nav class="nav-shell" aria-label="主導覽">
    <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span class="brand-name">Campus<span>Mate</span><small>校園生活資訊小幫手</small></span></a>
    <a class="nav-link" href="{{ url_for('home') }}">返回首頁</a>
  </nav></header>
  <main class="auth-main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}<div class="flash-stack">{% for category, message in messages %}<div class="flash-message flash-{{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="auth-footer">© CampusMate · 校園生活資訊小幫手</footer>
</body>
</html>
